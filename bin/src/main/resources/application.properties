spring.application.name=cotacao_publica

spring.datasource.url=jdbc:mysql://localhost:3306/db_cotacao?createDatabaseIfNotExist=true&serverTimezone=America/Sao_Paulo&useUnicode=true&characterEncoding=UTF-8&useSSL=false

spring.datasource.username=root
spring.datasource.password=Teotonio
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.flyway.baseline-on-migrate=true

server.port=8080
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.flywaydb=INFO